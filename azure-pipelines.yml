trigger:
- main # Se activa cuando haces push a la rama 'main'

pool:
  vmImage: 'ubuntu-latest' # Usamos una máquina Linux (estándar de la industria)

variables:
  dockerRegistryServiceConnection: 'DockerHub-SistemaVenta' # Nombre del service connection que crearas en Azure DevOps
  imageRepository: 'alexjuniortupapa/apisistemaventa-api'
  tag: '$(Build.BuildId)'

steps:
- script: echo Compilando el proyecto...
  displayName: 'Mensaje Inicial'

- task: UseDotNet@2 # Aseguramos tener .NET instalado
  inputs:
    packageType: 'sdk'
    version: '10.x' # ¡Tu versión .NET 10!

- script: dotnet restore
  displayName: 'Restaurar Paquetes'

- script: dotnet build --configuration Release
  displayName: 'Compilar Proyecto'

- script: dotnet test SistemaVenta.Tests/SistemaVenta.Tests.csproj --configuration Release --no-build
  displayName: 'Ejecutar Tests (SQLite Integration)'

# 🐳 Docker: construir y publicar la imagen del API en Docker Hub
- task: Docker@2
  displayName: 'Build & Push Imagen Docker'
  inputs:
    containerRegistry: $(dockerRegistryServiceConnection)
    repository: $(imageRepository)
    command: 'buildAndPush'
    Dockerfile: 'Dockerfile'
    tags: |
      $(tag)
      latest